<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comic chương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Patrick+Hand&family=Playfair+Display:wght@700;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
/* Mẫu hệ thống comic của game: ảnh AI chỉ là lớp nền; khung, lời dẫn, bóng thoại, nhãn sử liệu
   và bộ lọc thống nhất phong cách đều do engine dựng từ panels.json — để dịch được, đúng dấu,
   và để 500 ảnh từ nhiều lần sinh trông như cùng một tay vẽ. */
:root {
  --lacquer: #140c08;      /* đen sơn mài */
  --umber: #2b1810;
  --vermilion: #b8321f;    /* son */
  --gold: #d9a441;
  --gold-soft: #a7823f;
  --ivory: #f4ead4;
  --ink: #120d0a;
  --jade: #3f6b57;
  --text: #f4ead4;
  --muted: #bfae8c;
  --gutter: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--lacquer); color: var(--text); font-family: "Be Vietnam Pro", system-ui, sans-serif; }
body { min-height: 100vh; background:
  radial-gradient(ellipse at 50% -10%, #3a1d12 0%, transparent 60%),
  var(--lacquer); }
button { font: inherit; color: inherit; }

/* ---------- thanh điều khiển ---------- */
.bar { position: sticky; top: 0; z-index: 20; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 10px 16px; background: rgba(20,12,8,.92); border-bottom: 1px solid #4a3020; backdrop-filter: blur(6px); }
.bar h1 { font: 700 16px/1.2 "Playfair Display", serif; margin: 0 auto 0 0; color: var(--gold); letter-spacing: .02em; }
.seg { display: inline-flex; border: 1px solid var(--gold-soft); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); font-weight: 600; }

main { max-width: 1280px; margin: 0 auto; padding: 16px; }

/* ---------- bìa chương ---------- */
.cover { position: relative; margin: 8px 0 28px; padding: 48px 24px; text-align: center; border: 2px solid var(--gold-soft);
  background: linear-gradient(160deg, #3b120b, #1a0d08 55%, #2a1409); outline: 1px solid #5c3b1d; outline-offset: -10px; }
.cover .era { color: var(--gold); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
.cover h2 { font: 900 clamp(34px, 7vw, 72px)/1.05 "Playfair Display", serif; margin: 12px 0 8px; color: var(--ivory);
  text-shadow: 0 2px 0 #000, 0 0 30px rgba(217,164,65,.25); }
.cover p { margin: 0; color: var(--muted); }
.drum { width: 120px; height: 120px; margin: 0 auto 18px; opacity: .85; }

.part-title { display: flex; align-items: center; gap: 12px; margin: 28px 0 12px; color: var(--gold); font: 700 18px "Playfair Display", serif; }
.part-title::before, .part-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-soft), transparent); }

/* ---------- trang & khung ---------- */
.page { background: var(--ivory); padding: var(--gutter); margin: 0 0 22px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: var(--gutter); }
.row { display: flex; gap: var(--gutter); }
.panel { position: relative; overflow: hidden; background: #2a1a12; border: 3px solid var(--ink); min-width: 0; container-type: size; }
/* scale 1.05: AI hay tự vẽ một đường viền khung sát mép ảnh (O3, O8, K5) — cắt ~2,5% mỗi
   cạnh là mất viền đó, để chỉ còn viền của hệ thống comic, không bị khung đôi */
.panel .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.05); }
.fx .panel .art { filter: url(#lacquer) saturate(.92) contrast(1.06); }
/* giấy dó + mép tối: một lớp chung phủ mọi ảnh để thống nhất chất liệu */
.fx .panel::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .35;
  background:
    radial-gradient(ellipse at center, transparent 55%, rgba(40,15,5,.55) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.panel .inner-gold { position: absolute; inset: 4px; border: 1px solid rgba(217,164,65,.55); pointer-events: none; z-index: 2; }

/* khung chưa có ảnh: hiện prompt để duyệt kịch bản trước khi tiêu credit */
.placeholder { position: absolute; inset: 0; padding: 14px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  background: repeating-linear-gradient(135deg, #2b1810 0 14px, #26150e 14px 28px); color: var(--muted); font-size: 12px; line-height: 1.45; }
.placeholder b { color: var(--gold); font-size: 13px; }
.placeholder .scene { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

/* lời dẫn */
.cap { position: absolute; left: 10px; top: 10px; max-width: min(62%, 440px); z-index: 3; background: var(--ivory); color: var(--ink);
  border: 2px solid var(--ink); padding: 7px 10px 8px; font-size: clamp(11px, 1.25vw, 15px); line-height: 1.4; box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
.cap.tr { left: auto; right: 10px; }
.cap.bl { top: auto; bottom: 10px; }
.cap.br { top: auto; bottom: 10px; left: auto; right: 10px; }
.cap .label { display: inline-block; margin-left: 6px; font-size: .72em; padding: 0 6px; border-radius: 3px; vertical-align: 1px; font-weight: 600; }
.label.chinh-su { background: var(--jade); color: #fff; }
.label.tuong-truyen { background: var(--gold); color: var(--ink); }
.label.hu-cau { background: #6a5a4a; color: #fff; }

/* bóng thoại */
/* width: max-content — nếu không, bóng đặt gần mép phải bị trình duyệt co theo phần bề ngang
   còn lại (left 89% → chỉ còn 11%) và chữ bị bẻ từng từ một */
.bub { position: absolute; z-index: 4; transform: translate(-50%, 0); width: max-content; max-width: min(44%, 320px); background: #fff; color: var(--ink);
  border: 2px solid var(--ink); border-radius: 18px; padding: 7px 12px 8px; font: 400 clamp(13px, 1.45vw, 18px)/1.25 "Patrick Hand", "Be Vietnam Pro", sans-serif; }
.bub .who { display: block; font: 700 .66em/1.2 "Be Vietnam Pro", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--vermilion); margin-bottom: 2px; }
.bub::after { content: ""; position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--ink); border-top: 0; border-left: 0; }
.bub.down::after { left: 50%; bottom: -8px; transform: translateX(-50%) rotate(45deg); }
.bub.left::after { left: -8px; top: 50%; transform: translateY(-50%) rotate(135deg); }
.bub.right::after { right: -8px; top: 50%; transform: translateY(-50%) rotate(-45deg); }

/* ---------- xem từng khung (điện thoại) ---------- */
.guided .page { background: none; box-shadow: none; padding: 0; }
.guided .row { display: contents; }
.guided .panel { display: none; }
/* flex: none — ở chế độ trang, khung có flex-basis 0 để chia hàng; trong cột flex của .page
   (hàng đã display: contents) basis 0 đè mất aspect-ratio và khung co về 0px. Bề ngang tính
   theo chiều cao màn hình × tỉ lệ khung (--ar), để khung luôn vừa màn điện thoại xoay ngang. */
.guided .panel.on { display: block; flex: none !important; margin: 0 auto;
  width: min(100%, calc((100vh - 120px) * var(--ar))); }
.guided .cover { padding: 14px; margin-bottom: 10px; }
.guided .cover h2 { font-size: 26px; margin: 4px 0; }
.guided .drum, .guided .cover .era { display: none; }
.guided .page:not(.has-on), .guided .part-title:not(.has-on) { display: none; }
.guided .cap, .guided .bub { animation: rise .35s ease both; }
.guided .bub { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
.guided .cap { animation-name: capin; }
@keyframes capin { from { opacity: 0; } }
/* đọc từng khung: lời dẫn rồi từng bóng thoại hiện dần theo mỗi lần chạm (.later = chưa tới lượt) */
.guided .panel.on .later { visibility: hidden; }
.guided .battle-card { display: none; }
.nav { display: none; }
.guided .nav { display: flex; justify-content: center; align-items: center; gap: 14px; position: fixed; left: 50%; bottom: 10px;
  transform: translateX(-50%); z-index: 30; background: rgba(20,12,8,.9); border: 1px solid #4a3020; border-radius: 999px; padding: 4px 8px; }
.guided main { padding-bottom: 70px; }
.nav button { background: var(--umber); border: 1px solid var(--gold-soft); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
.nav .count { color: var(--muted); font-size: 13px; min-width: 70px; text-align: center; }

/* thẻ vào trận */
.battle-card { margin: 26px 0; padding: 26px 18px; text-align: center; border: 2px dashed var(--vermilion); color: var(--ivory); background: #24100b; }
.battle-card strong { display: block; font: 900 26px "Playfair Display", serif; color: var(--gold); margin-bottom: 6px; }

/* ---------- Sử quán + Quiz ---------- */
.quiz { margin: 30px 0 60px; padding: 22px; border: 2px solid var(--gold-soft); background: #1e110b; }
.quiz h3 { margin: 0 0 4px; font: 700 22px "Playfair Display", serif; color: var(--gold); }
.quiz .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.q { font-size: 18px; font-weight: 600; margin: 12px 0; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.opts button { text-align: left; padding: 12px 14px; border-radius: 8px; border: 1px solid #5a4030; background: #2a1810; cursor: pointer; font-size: 15px; }
.opts button:hover:not(:disabled) { border-color: var(--gold); }
.opts button.right { background: #20402f; border-color: #5fae82; }
.opts button.wrong { background: #4a1a14; border-color: var(--vermilion); }
.why { margin-top: 12px; padding: 12px 14px; background: var(--ivory); color: var(--ink); border-left: 4px solid var(--jade); line-height: 1.5; font-size: 15px; }
.why a { color: var(--vermilion); font-weight: 600; cursor: pointer; }
.qnav { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; color: var(--muted); font-size: 14px; }
.qnav button { background: var(--gold); color: var(--ink); border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 600; cursor: pointer; }

.flash { outline: 4px solid var(--gold); outline-offset: 2px; transition: outline-color 1.2s; }

@media (max-width: 700px) {
  main { padding: 10px; }
  :root { --gutter: 6px; }
  .row { flex-wrap: wrap; }
  .row > .panel { flex-basis: 100% !important; }
  .cap { max-width: 78%; }
  .bub { max-width: 64%; }
}
@media (prefers-reduced-motion: reduce) { .guided .cap, .guided .bub { animation: none; } }

/* chữ trên cờ/biển do engine vẽ đè (ảnh AI chỉ có ô trống): luôn đúng nét, không phải sinh lại ảnh */
.sign { position: absolute; z-index: 2; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
  font-family: "Noto Serif TC", "Noto Serif SC", serif; font-weight: 900; color: #f2c14e; line-height: 1.05;
  text-shadow: 0 0 2px #5a1a0a, 0 1px 0 #3a0e05, 0 0 8px rgba(0,0,0,.35); }
.sign.vertical { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .08em; }

/* nhãn của HÌNH (khác nhãn lời dẫn): ví dụ lời dẫn là Chính sử nhưng việc vẽ Yết Kiêu là Tương truyền */
.imglabel { position: absolute; right: 10px; bottom: 10px; z-index: 3; font-size: 11px; padding: 2px 8px; border-radius: 3px;
  background: rgba(20,12,8,.82); color: var(--ivory); border: 1px solid var(--gold-soft); }

/* ---------- Hiến kế (Quyết sách) ---------- */
.council-page { background: none !important; box-shadow: none !important; padding: 0 !important; }
/* container-type: normal — khung Hiến kế cao theo nội dung; "size" sẽ làm nó co về 0 */
.panel.council { container-type: normal; aspect-ratio: auto !important; background: linear-gradient(160deg, #2a120c, #160c08); border: 2px solid var(--gold-soft); padding: 18px; color: var(--ivory); }
.council h3 { margin: 0 0 4px; font: 700 20px "Playfair Display", serif; color: var(--gold); }
.council .sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.council .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.council .card { text-align: left; padding: 14px; border-radius: 8px; border: 1px solid #5a4030; background: #2a1810; cursor: pointer; font-size: 15px; line-height: 1.45; }
.council .card:hover:not(:disabled) { border-color: var(--gold); }
.council .card:disabled { cursor: default; }
.council .card.picked { border: 2px solid var(--gold); background: #3a2414; }
.council .card .tag { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
.council .after { margin-top: 12px; color: var(--muted); font-size: 14px; }
.page.locked, .part-title.locked { display: none !important; }
.guided .panel.council.on { width: min(100%, 760px); }

/* ?shot=N — chỉ vẽ trang N trên nền đen phẳng, để chụp ảnh trang bằng Chrome headless
   (xem shoot.py). Không dùng khi chơi. */
body.shot { background: #000; }
.shot .bar, .shot .cover, .shot .part-title, .shot .battle-card, .shot .quiz, .shot .nav, .shot .page:not(.shot-on) { display: none !important; }
.shot main { max-width: 1600px; padding: 24px; }
.shot .page { margin: 0; box-shadow: none; }
</style>
</head>
<body class="fx">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Bộ lọc thống nhất: làm nét nét mực → giảm dải màu (7 bậc) → kéo về tông sơn mài ấm.
       Đây là thứ biến ảnh AI lệch tông nhau thành cùng một "tay vẽ". Tắt bằng nút "Ảnh gốc". -->
  <filter id="lacquer" color-interpolation-filters="sRGB">
    <feConvolveMatrix order="3" kernelMatrix="0 -0.6 0  -0.6 3.4 -0.6  0 -0.6 0" preserveAlpha="true"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 .16 .32 .5 .66 .82 1"/>
      <feFuncG type="discrete" tableValues="0 .15 .3 .46 .62 .8 .96"/>
      <feFuncB type="discrete" tableValues="0 .13 .26 .4 .55 .7 .86"/>
    </feComponentTransfer>
    <feColorMatrix type="matrix" values="1.06 .04 0 0 .012   .02 .98 .02 0 0   0 .04 .88 0 0   0 0 0 1 0"/>
  </filter>
</svg>

<div class="bar">
  <h1 id="title">Chương</h1>
  <div class="seg" role="group" aria-label="Chế độ xem">
    <button id="mPage" aria-pressed="true">Trang</button>
    <button id="mGuided" aria-pressed="false">Từng khung</button>
  </div>
  <div class="seg" role="group" aria-label="Ngôn ngữ">
    <button id="lVi" aria-pressed="true">VI</button>
    <button id="lEn" aria-pressed="false">EN</button>
  </div>
  <div class="seg" role="group" aria-label="Bộ lọc">
    <button id="fOn" aria-pressed="true">Phong cách comic</button>
    <button id="fOff" aria-pressed="false">Ảnh gốc</button>
  </div>
</div>

<main id="app"></main>

<script>
// ?ch=<thư mục chương> — chỉ nhận tên thư mục (chữ, số, gạch nối), rồi nạp ../<chương>/comic-data.js
(function boot() {
  const ch = new URLSearchParams(location.search).get("ch") || "B20-bach-dang";
  const app = document.getElementById("app");
  if (!/^[A-Za-z0-9-]+$/.test(ch)) { app.textContent = "Tên chương không hợp lệ."; return; }
  const s = document.createElement("script");
  s.src = `../${ch}/comic-data.js`;
  s.onload = main;
  s.onerror = () => { app.innerHTML = `<p>Chưa có dữ liệu chương ${ch} — chạy <code>node _tool/render.mjs ${ch} --data</code>.</p>`; };
  document.head.appendChild(s);
})();
function main() {
  const C = window.COMIC;
  const app = document.getElementById("app");
  if (!C) return;
  document.title = C.chapter.title.vi;
  // font Hán chỉ tải đúng các chữ trên cờ/biển của chương (Google Fonts &text=), vài KB thay vì vài MB
  const signText = [...new Set(C.panels.flatMap(p => (p.signs || []).map(s => s.text)).join(""))].join("");
  if (signText) {
    const l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap&text=" + encodeURIComponent(signText);
    document.head.appendChild(l);
  }
  let lang = "vi", guided = matchMedia("(max-width: 700px)").matches, idx = 0;
  const byId = Object.fromEntries(C.panels.map(p => [p.id, p]));
  const ratio = a => { const [w, h] = a.split(":").map(Number); return w / h; };
  const slug = l => ({ "Chính sử": "chinh-su", "Tương truyền": "tuong-truyen", "Hư cấu": "hu-cau" }[l] || "hu-cau");
  let choice = null;                                   // thẻ Hiến kế người chơi đã chọn (A/B/C)
  const card = id => C.council && C.council.cards.find(c => c.id === id);
  const T = { open: { vi: "Mở chương · Tình thế", en: "Opening · The situation" }, close: { vi: "Kết chương", en: "Aftermath" },
    council: { vi: "Hiến kế", en: "Council" }, decree: { vi: "Chủ soái quyết", en: "The commander decides" },
    pick: { vi: "Chọn một kế để xem chủ soái quyết.", en: "Offer a plan to see the commander's decision." },
    oldway: { vi: "Cách người xưa đã làm", en: "What history did" },
    after: { vi: "Chủ soái luôn quyết theo sử — trận không đổi dù bạn hiến kế nào. Thẻ đúng cách người xưa mở thêm tình báo cho trận.", en: "The commander always follows history — the battle is the same whatever you offer. The historical plan grants extra intelligence." },
    battle: { vi: "Vào trận", en: "To battle" },
    quiz: { vi: "Sử quán · Thử tài", en: "Archive · Quiz" }, quizSub: { vi: "Không trừ điểm. Câu trả lời sai sẽ được hỏi lại ở lần sau.", en: "No penalty. Missed questions come back later." },
    next: { vi: "Câu tiếp", en: "Next" }, again: { vi: "Làm lại", en: "Retry" }, see: { vi: "Xem lại khung", en: "See panel" },
    done: { vi: "Hoàn thành", en: "Done" }, noimg: { vi: "Chưa có ảnh", en: "No image yet" } };
  const t = k => T[k][lang];

  function panelEl(id) {
    const p = byId[id], el = document.createElement("div");
    el.className = "panel"; el.id = "p-" + id; el.dataset.id = id;
    el.style.flex = ratio(p.aspect) + " 1 0"; el.style.aspectRatio = p.aspect.replace(":", " / ");
    el.style.setProperty("--ar", ratio(p.aspect));
    const src = C.images && C.images[id];
    el.innerHTML = (src ? `<img class="art" src="${src}" alt="">`
      : `<div class="placeholder"><b>${id} · ${t("noimg")} · ${p.aspect}</b><div class="scene">${p.scene}</div></div>`)
      + `<div class="inner-gold"></div>`;
    if (p.caption) {
      // capPos: tl (mặc định) | tr | bl | br — khi góc trên-trái vướng nhân vật; capW: % bề rộng tối đa
      const c = document.createElement("div"); c.className = "cap" + (p.capPos && p.capPos !== "tl" ? " " + p.capPos : "");
      if (p.capW) c.style.maxWidth = `min(${p.capW}%, 440px)`;
      c.innerHTML = `${p.caption[lang]}<span class="label ${slug(p.caption.label)}">${p.caption.label}</span>`;
      el.appendChild(c);
    }
    for (const b of p.bubbles || []) {
      // bóng "from": lời lấy từ Hiến kế — reply đổi theo thẻ đã chọn, decree luôn như nhau
      const text = b.from === "reply" ? (card(choice) ? card(choice).reply[lang] : "…")
        : b.from === "decree" ? C.council.decree[lang] : b[lang];
      const d = document.createElement("div"); d.className = "bub " + (b.tail || "down");
      d.style.left = b.x + "%"; d.style.top = b.y + "%";
      d.innerHTML = `<span class="who">${b.who}</span>${text}`;
      el.appendChild(d);
    }
    for (const s of p.signs || []) {
      // size = % chiều cao khung → cỡ chữ theo cqh (khung là container query), để chữ co giãn cùng ảnh
      const d = document.createElement("div"); d.className = "sign" + (s.vertical ? " vertical" : "");
      d.style.left = s.x + "%"; d.style.top = s.y + "%"; d.style.fontSize = (s.size || 6) + "cqh";
      if (s.rotate) d.style.transform = `translate(-50%, -50%) rotate(${s.rotate}deg)`;
      d.textContent = s.text;
      el.appendChild(d);
    }
    if (p.imageLabel) {
      const l = document.createElement("div"); l.className = "imglabel"; l.textContent = p.imageLabel[lang]; el.appendChild(l);
    }
    return el;
  }

  // xáo vị trí thẻ cố định theo chương (dữ liệu luôn để thẻ lịch sử ở đầu); không lộ nhãn trước khi chọn
  function councilEl() {
    const wrap = document.createElement("section"); wrap.className = "page council-page"; wrap.dataset.part = "council";
    const el = document.createElement("div"); el.className = "panel council"; el.dataset.id = "HIEN-KE";
    const cards = C.council.cards.map((c, i) => [c, i]).sort((a, b) => mix(a[1], 7) - mix(b[1], 7)).map(([c]) => c);
    el.innerHTML = `<h3>${C.council.title[lang]}</h3><p class="sub">${C.council.prompt[lang]}</p><div class="cards">${cards.map(c =>
      `<button class="card${choice === c.id ? " picked" : ""}" data-id="${c.id}"${choice ? " disabled" : ""}>${c.text[lang]}${choice
        ? `<span class="tag">${c.historical ? t("oldway") + " · " : ""}<span class="label ${slug(c.label)}">${c.label}</span></span>` : ""}</button>`).join("")}</div>
      <p class="after">${choice ? t("after") : t("pick")}</p>${C.council.skipInVS
        ? `<p class="after">${lang === "vi" ? "Bản vertical slice bỏ qua bước này vì đây là màn hướng dẫn; bản ra mắt R1 có." : "The vertical slice skips this step (tutorial chapter); the R1 release includes it."}</p>` : ""}`;
    el.querySelectorAll(".card").forEach(b => b.onclick = e => {
      e.stopPropagation(); if (choice) return;
      choice = b.dataset.id; step = 0; render();
      if (guided) go(1);                                   // sang ngay khung D1: chủ soái đáp lời
    });
    wrap.appendChild(el);
    return wrap;
  }

  function render() {
    document.getElementById("title").textContent = C.chapter.title[lang];
    document.body.classList.toggle("guided", guided);
    app.innerHTML = `<section class="cover">
      <svg class="drum" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#d9a441" stroke-width="1.4">
        <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="24"/><circle cx="50" cy="50" r="9" fill="#d9a441"/>
        ${Array.from({ length: 14 }, (_, i) => { const a = i / 14 * Math.PI * 2; return `<line x1="${50 + 9 * Math.cos(a)}" y1="${50 + 9 * Math.sin(a)}" x2="${50 + 22 * Math.cos(a)}" y2="${50 + 22 * Math.sin(a)}"/>`; }).join("")}
      </g></svg>
      <div class="era">${C.chapter.era}</div><h2>${C.chapter.title[lang]}</h2><p>${C.chapter.subtitle[lang]}</p></section>`;
    let lastPart = null;
    C.pages.forEach(pg => {
      const locked = pg.part === "decree" && !choice && C.council;
      if (pg.part !== lastPart) {
        if (pg.part === "decree" && C.council) {
          const h = document.createElement("div"); h.className = "part-title"; h.dataset.part = "council"; h.textContent = t("council"); app.appendChild(h);
          app.appendChild(councilEl());
        }
        if (pg.part === "close") {
          const bc = document.createElement("div"); bc.className = "battle-card";
          bc.innerHTML = `<strong>${t("battle")}: ${C.chapter.name[lang]}</strong>${C.chapter.battle[lang]}`; app.appendChild(bc);
        }
        const h = document.createElement("div"); h.className = "part-title" + (locked ? " locked" : ""); h.dataset.part = pg.part; h.textContent = t(pg.part); app.appendChild(h);
        lastPart = pg.part;
      }
      const page = document.createElement("section"); page.className = "page" + (locked ? " locked" : ""); page.dataset.part = pg.part;
      pg.rows.forEach(r => { const row = document.createElement("div"); row.className = "row"; r.forEach(id => row.appendChild(panelEl(id))); page.appendChild(row); });
      app.appendChild(page);
    });
    const nav = document.createElement("div"); nav.className = "nav";
    nav.innerHTML = `<button id="prev">‹</button><span class="count" id="count"></span><button id="next">›</button>`;
    app.appendChild(nav);
    app.appendChild(quizEl());
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    if (guided) show();
    requestAnimationFrame(clampBubbles);
  }

  // x của bóng thoại là TÂM bóng (translate -50%). Dữ liệu viết tay hay đặt x như mép trái (x = 5)
  // nên nửa bóng lòi ra ngoài khung — kéo mọi bóng vào trong khung, chừa 6 px.
  function clampBubbles() {
    for (const b of app.querySelectorAll(".bub")) {
      b.style.marginLeft = "0px";
      const p = b.closest(".panel").getBoundingClientRect(), r = b.getBoundingClientRect();
      if (!p.width) continue;
      const shift = r.left < p.left + 6 ? p.left + 6 - r.left : r.right > p.right - 6 ? p.right - 6 - r.right : 0;
      if (shift) b.style.marginLeft = shift + "px";
    }
  }
  addEventListener("resize", () => requestAnimationFrame(clampBubbles));

  const order = () => [...app.querySelectorAll(".panel")];
  let step = 0;                                        // số lớp chữ đã hiện trong khung hiện tại
  const layers = el => [...el.querySelectorAll(".cap,.bub")];
  function reveal(cur) { layers(cur).forEach((e, i) => e.classList.toggle("later", i > step)); }
  function show() {
    const ps = order(); idx = Math.max(0, Math.min(idx, ps.length - 1));
    app.querySelectorAll(".on,.has-on").forEach(e => e.classList.remove("on", "has-on"));
    const cur = ps[idx]; cur.classList.add("on");
    const page = cur.closest(".page"); page.classList.add("has-on");
    app.querySelectorAll(`.part-title[data-part="${page.dataset.part}"]`).forEach(e => e.classList.add("has-on"));
    // khung mở đầu phần mới: dựng lại để hoạt ảnh lời dẫn/bóng thoại chạy lại
    cur.querySelectorAll(".cap,.bub").forEach(e => { e.style.animation = "none"; void e.offsetWidth; e.style.animation = ""; });
    document.getElementById("count").textContent = `${idx + 1} / ${ps.length}`;
    cur.scrollIntoView({ block: "center", behavior: "instant" });
    reveal(cur);
    requestAnimationFrame(clampBubbles);
  }
  // tiến: hiện lớp chữ kế tiếp trong khung; hết lớp mới sang khung sau. Lùi: về khung trước, hiện đủ chữ.
  function go(d) {
    const cur = order()[idx];
    if (d > 0 && cur && cur.classList.contains("council") && !choice) return;   // phải hiến kế rồi mới đi tiếp
    if (d > 0 && cur && step < layers(cur).length - 1) { step++; reveal(cur); return; }
    idx += d;
    const nxt = order()[Math.max(0, Math.min(idx, order().length - 1))];
    step = d < 0 && nxt ? layers(nxt).length - 1 : 0;
    show();
  }
  addEventListener("keydown", e => { if (!guided) return; if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
  app.addEventListener("click", e => {
    if (!guided) return; const p = e.target.closest(".panel.on"); if (!p || p.classList.contains("council")) return;
    const r = p.getBoundingClientRect(); go(e.clientX - r.left > r.width / 3 ? 1 : -1);
  });

  // ---------- quiz ----------
  let qi = 0, score = 0, missed = [];
  // xáo thứ tự đáp án cố định theo câu (dữ liệu luôn để đáp án đúng ở vị trí 0)
  const mix = (i, q) => { const s = Math.sin((i + 1) * 12.9898 + (q + 1) * 78.233) * 43758.5453; return s - Math.floor(s); };
  function quizEl() {
    const box = document.createElement("section"); box.className = "quiz"; box.id = "quiz";
    const draw = () => {
      if (qi >= C.quiz.length) {
        box.innerHTML = `<h3>${t("quiz")}</h3><p class="q">${score} / ${C.quiz.length}</p>
          <p class="sub">${missed.length ? (lang === "vi" ? "Hẹn lần sau với " + missed.length + " câu chưa đúng." : missed.length + " question(s) will return later.") : (C.chapter.card ? C.chapter.card[lang] : (lang === "vi" ? "Trọn vẹn! Mở khóa thẻ Sử quán của chương." : "Perfect! Archive card unlocked."))}</p>
          <div class="qnav"><span></span><button id="qr">${t("again")}</button></div>`;
        box.querySelector("#qr").onclick = () => { qi = 0; score = 0; missed = []; draw(); };
        return;
      }
      const Q = C.quiz[qi];
      box.innerHTML = `<h3>${t("quiz")}</h3><p class="sub">${t("quizSub")}</p><div class="q">${qi + 1}. ${Q.q[lang]}</div>
        <div class="opts">${(lang === "en" && Q.optionsEn ? Q.optionsEn : Q.options).map((o, i) => [o, i]).sort((a, b) => mix(a[1], qi) - mix(b[1], qi))
          .map(([o, i]) => `<button data-i="${i}">${o}</button>`).join("")}</div><div id="fb"></div>`;
      box.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
        const i = +b.dataset.i, ok = i === Q.answer;
        if (ok) score++; else missed.push(qi);
        box.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === Q.answer) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        box.querySelector("#fb").innerHTML = `<div class="why">${Q.why[lang]} <span class="label ${slug(Q.label)}">${Q.label}</span>
          · <a data-panel="${Q.panel}">${t("see")} ${Q.panel}</a></div>
          <div class="qnav"><span>${qi + 1} / ${C.quiz.length}</span><button id="qn">${qi + 1 < C.quiz.length ? t("next") : t("done")}</button></div>`;
        box.querySelector("#qn").onclick = () => { qi++; draw(); };
        box.querySelector("a[data-panel]").onclick = e => {
          const id = e.target.dataset.panel;
          if (guided) { idx = order().findIndex(p => p.dataset.id === id); step = 99; show(); return; }
          const el = document.getElementById("p-" + id); el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400);
        };
      });
    };
    draw();
    return box;
  }

  const seg = (a, b, on) => { a.setAttribute("aria-pressed", on); b.setAttribute("aria-pressed", !on); };
  const $ = id => document.getElementById(id);
  $("mPage").onclick = () => { guided = false; seg($("mPage"), $("mGuided"), true); render(); };
  $("mGuided").onclick = () => { guided = true; idx = 0; step = 0; seg($("mPage"), $("mGuided"), false); render(); };
  $("lVi").onclick = () => { lang = "vi"; seg($("lVi"), $("lEn"), true); document.documentElement.lang = "vi"; render(); };
  $("lEn").onclick = () => { lang = "en"; seg($("lVi"), $("lEn"), false); document.documentElement.lang = "en"; render(); };
  $("fOn").onclick = () => { document.body.classList.add("fx"); seg($("fOn"), $("fOff"), true); };
  $("fOff").onclick = () => { document.body.classList.remove("fx"); seg($("fOn"), $("fOff"), false); };
  seg($("mPage"), $("mGuided"), !guided);
  const q = new URLSearchParams(location.search);
  if (q.has("lang")) lang = q.get("lang") === "en" ? "en" : "vi";
  if (q.has("choice")) choice = q.get("choice");
  if (q.has("shot")) { guided = false; document.body.classList.add("shot"); if (!choice) choice = "A"; }
  render();
  if (q.has("shot")) {
    // shot=council chụp màn Hiến kế; shot=N chụp trang comic thứ N (không đếm trang Hiến kế)
    const pg = q.get("shot") === "council" ? app.querySelector(".council-page") : app.querySelectorAll(".page:not(.council-page)")[+q.get("shot") || 0];
    if (pg) pg.classList.add("shot-on");
  }
}
</script>
</body>
</html>
