<head>

  <title>Phòng thử HUD B20</title>
  <link rel="icon" href="data:,">

  <style>
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    .stage.plain { background: linear-gradient(#8fa3a3, #5d6b5e 55%, #3a3a2c); }
    .labbar { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 9; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
    .labbar a { font-size: 11px; color: #e6dcc3; background: #221c18cc; border: 1px solid #5a4838; border-radius: 4px; padding: 1px 6px; text-decoration: none; }
    .labbar a.on { border-color: #c9a14a; color: #f1d98a; }
    .nobar .labbar { display: none; }
  </style>
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>

  <!-- Chỉ dùng khi phát triển: HUD thật (hud.js + hud-b20.js + css) trên một hudState giả, nền là lab-b20.html. Tham số ở đầu js/hud-lab.js. -->

  <div class="labbar"></div>
