<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tờ xem vật môi trường đã nướng</title>
<!-- Soát bản nướng env/* (design/tools/glb-bake.mjs env): dựng từng mã bằng đúng hàm game dùng (battle/glb.js envPart: màu phẳng theo mặt; &tex: lưới có
     texture của mã nướng với catalog tex) lên một tờ lưới, kèm người cao 1,75 m (khối xám) để so tỉ lệ, mặt nước xanh ở y 0 nếu vật có mớn (thuyền),
     rồi gửi JPEG về máy chủ (design/tools/serve.mjs /__save → design/glb/_raw/sheets/).
     Mở qua serve.mjs:  /design/glb/env-sheet.html?from=0&n=30&cols=6&cell=256&view=front|straight|side|top&lod=0|1&only=ENV_a,ENV_b&tex -->
<script type="importmap">
  { "imports": { "three": "../../game/vendor/three/three.module.js", "three/addons/": "../../game/vendor/three/addons/" } }
</script>
<style>body { margin: 0; background: #e9e5dc; font: 12px system-ui } #log { padding: 6px }</style>
</head>
<body>
<div id="log">đang chạy…</div>
<script type="module">
import * as THREE from "three";
import { preloadModels, envPart, envMesh, envBounds } from "../../game/js/battle/glb.js";

const q = new URLSearchParams(location.search);
const from = +(q.get("from") || 0), n = +(q.get("n") || 30), cols = +(q.get("cols") || 6), cell = +(q.get("cell") || 256), view = q.get("view") || "front";
const lod = +(q.get("lod") || 0), tex = q.has("tex"), only = q.get("only");
const index = await (await fetch("../../game/assets/models/index.json", { cache: "no-store" })).json();
const all = Object.keys(index).filter((k) => k.startsWith("env/")).map((k) => k.slice(4));
const names = (only ? only.split(",").filter((s) => all.includes(s)) : all).slice(from, from + n);
await preloadModels(names.map((s) => "env/" + s), 60000);
const rows = Math.ceil(names.length / cols), sheet = document.createElement("canvas");
sheet.width = cols * cell; sheet.height = rows * (cell + 18);
const sc = sheet.getContext("2d"); sc.fillStyle = "#e9e5dc"; sc.fillRect(0, 0, sheet.width, sheet.height); sc.font = "bold 12px system-ui";
document.body.appendChild(sheet);

const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(cell, cell); R.setClearColor(0xd9d4c8); R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
// ánh sáng gần cảnh Hàm Tử (world.js: bán cầu ấm 1,15, nắng 2,1)
scene.add(new THREE.HemisphereLight(0xffe6c0, 0x3a3020, 1.15));
const sun = new THREE.DirectionalLight(0xffd29a, 2.1); sun.position.set(-60, 90, 50); scene.add(sun);
const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 2000);
const flat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const person = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.75, 0.3).translate(0, 0.875, 0), new THREE.MeshLambertMaterial({ color: 0x55504a }));
const water = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x3f6f8a, transparent: true, opacity: 0.45, depthWrite: false }));

for (let i = 0; i < names.length; i++) {
  const id = names[i], x = (i % cols) * cell, y = Math.floor(i / cols) * (cell + 18);
  let label = id.replace(/^ENV_/, "");
  const b = envBounds(id);
  if (!b) { sc.fillStyle = "#c33"; sc.fillRect(x, y, cell, cell); label += "  chưa nạp"; }
  else {
    const obj = tex ? envMesh(id) : new THREE.Mesh(envPart(id, { lod }), flat);
    const lo = new THREE.Vector3(...b.lo), hi = new THREE.Vector3(...b.hi), s = hi.clone().sub(lo);
    person.position.set(hi.x + Math.max(0.4, s.x * 0.08), Math.max(0, lo.y), 0);
    water.visible = lo.y < -0.01; water.scale.set(s.x * 1.6 + 1, 1, s.z * 1.3 + 1);
    scene.add(obj, person, water);
    const box = new THREE.Box3().setFromObject(obj).expandByObject(person), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    const r = Math.max(sz.x, sz.y, sz.z) * 0.5 * 1.25 / Math.tan(THREE.MathUtils.degToRad(16));
    const dirv = view === "straight" ? new THREE.Vector3(0, 0.06, 1) : view === "side" ? new THREE.Vector3(1, 0.12, 0) : view === "top" ? new THREE.Vector3(0.001, 1, 0.001) : new THREE.Vector3(0.55, 0.3, 0.8);
    cam.position.copy(c).addScaledVector(dirv.normalize(), r); cam.lookAt(c); cam.near = r / 100; cam.far = r * 4; cam.updateProjectionMatrix();
    R.render(scene, cam);
    sc.drawImage(R.domElement, x, y, cell, cell);
    const tris = (obj.geometry.index ? obj.geometry.index.count : obj.geometry.attributes.position.count) / 3;
    label += `  ${s.x.toFixed(1)}×${s.y.toFixed(1)}×${s.z.toFixed(1)} · ${tris}`;
    scene.remove(obj, person, water);
  }
  sc.fillStyle = "#1d1a17"; sc.fillText(`${from + i} ${label}`, x + 4, y + cell + 13);
  document.getElementById("log").textContent = `${i + 1}/${names.length} ${id}`;
}
const blob = await new Promise((r) => sheet.toBlob(r, "image/jpeg", 0.88));
const out = `env-${view}${tex ? "-tex" : ""}-lod${lod}-${only ? "sel" : from}.jpg`;
const resp = await fetch(`/__save?name=${out}`, { method: "POST", body: blob });
document.getElementById("log").textContent = "xong: " + await resp.text();
window.__done = true;
</script>
</body>
</html>
